name: godluckwiththat
description: A city builder, resource management, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  get_it: ^7.6.7
  logger: ^2.1.0
  dafluta: ^5.2.0
  url_strategy: ^0.2.0
  json_annotation: ^4.8.1
  just_the_tooltip: ^0.0.12
  shared_preferences: ^2.2.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.4.0
  daunused: ^1.6.1
  dapublock: ^1.1.0
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/sono.ttf

  assets:
    - assets/audio/sfx/
    - assets/images/
    - assets/images/buildings/producers/
    - assets/images/buildings/consumers/
    - assets/images/other/
    - assets/images/resources/
    - assets/images/units/