name: tensionnode
description: A resource management tower defense game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  get_it: ^7.2.0
  dafluta: ^4.8.0
  url_strategy: ^0.2.0
  json_annotation: ^4.8.0
  package_info_plus: ^3.0.2

  flame: ^1.6.0
  flame_audio: ^1.4.0

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  json_serializable: ^6.6.0

flutter:
  uses-material-design: true

  fonts:
    - family: Magnite
      fonts:
        - asset: assets/fonts/Magnite.otf

  assets:
    - assets/audio/sfx/
    - assets/fonts/
    - assets/images/
    - assets/matches/