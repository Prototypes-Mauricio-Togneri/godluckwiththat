name: godluckwiththat
description: A city builder, resource management, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.5.3 <4.0.0'

dependencies:
  get_it: ^8.0.0
  logger: ^2.4.0
  dafluta: ^5.4.0
  url_strategy: ^0.3.0
  json_annotation: ^4.9.0
  just_the_tooltip: ^0.0.12
  shared_preferences: ^2.3.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.5.0
  daassets: ^1.5.0
  daunused: ^1.6.1
  dapublock: ^1.1.0
  build_runner: ^2.4.12
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Outfit.ttf

  assets:
    - assets/audio/sfx/
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/buildings/misc/
    - assets/images/buildings/religious/
    - assets/images/buildings/resources/
    - assets/images/other/
    - assets/images/resources/
    - assets/images/units/