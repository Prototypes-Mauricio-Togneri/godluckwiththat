name: tensionplanet
description: A resource management game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <3.0.0'

dependencies:
  get_it: ^7.2.0
  logger: ^1.3.0
  dafluta: ^5.1.1
  url_strategy: ^0.2.0
  motion_toast: ^2.6.5
  json_annotation: ^4.8.0
  package_info_plus: ^3.0.3
  shared_preferences: ^2.0.20

  flame: ^1.6.0
  flame_audio: ^1.4.0
  flame_tiled: ^1.9.1
  flame_tiled_utils: ^1.0.7

  cloud_firestore: ^4.4.5
  firebase_core: ^2.8.0
  firebase_auth: ^4.3.0
  firebase_crashlytics: ^3.0.17

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  json_serializable: ^6.6.1

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Pixel.ttf

  assets:
    - assets/audio/sfx/
    - assets/images/
    - assets/images/buildings/assemblers/
    - assets/images/buildings/extractors/
    - assets/images/buildings/factories/
    - assets/images/buildings/other/
    - assets/images/buildings/power_plants/
    - assets/images/buildings/processors/
    - assets/images/patches/
    - assets/images/resources/
    - assets/images/resources/energy
    - assets/images/resources/materials
    - assets/images/resources/resources
    - assets/images/signs/
    - assets/tiles/