name: tensionnode
description: A resource management tower defense game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=2.18.6 <3.0.0'

dependencies:
  flame: ^1.6.0
  get_it: ^7.2.0
  dafluta: ^4.5.1
  motion_toast: ^2.6.4
  url_strategy: ^0.2.0
  json_annotation: ^4.7.0

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  json_serializable: ^6.5.4

flutter:
  uses-material-design: true

  fonts:
    - family: BungeeHairline
      fonts:
        - asset: assets/fonts/BungeeHairlineRegular.ttf

  assets:
    - assets/fonts/
    - assets/images/
    - assets/maps/