name: gatewayguardians
description: A city builder, resource management, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  get_it: ^7.6.0
  logger: ^2.0.1
  dafluta: ^5.1.1
  url_strategy: ^0.2.0
  json_annotation: ^4.8.1
  just_the_tooltip: ^0.0.12
  shared_preferences: ^2.2.0

  #flame: ^1.8.1
  #flame_audio: ^2.0.4
  #flame_tiled: ^1.12.0
  #flame_tiled_utils: ^1.1.0

  cloud_firestore: ^4.8.4
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.2
  firebase_crashlytics: ^3.3.4

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.4.6
  flutter_lints: ^2.0.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Dulcinea-Serif-Bold.ttf

  assets:
    - assets/audio/sfx/
    - assets/images/
    - assets/images/buildings/
    - assets/images/patches/
    - assets/images/resources/
    - assets/images/tiles/