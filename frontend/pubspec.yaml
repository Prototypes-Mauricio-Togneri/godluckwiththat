name: tensionnode
description: A resource management tower defense game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=2.19.1 <3.0.0'

dependencies:
  get_it: ^7.2.0
  logger: ^1.1.0
  dafluta: ^4.8.0
  url_strategy: ^0.2.0
  json_annotation: ^4.8.0
  package_info_plus: ^3.0.2
  shared_preferences: ^2.0.17

  flame: ^1.6.0
  flame_audio: ^1.4.0
  flame_tiled: ^1.9.1
  flame_tiled_utils: ^1.0.7

  cloud_firestore: ^4.3.1
  firebase_core: ^2.4.1
  firebase_auth: ^4.2.5
  firebase_crashlytics: ^3.0.11

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  json_serializable: ^6.6.1

flutter:
  uses-material-design: true

  fonts:
    - family: Magnite
      fonts:
        - asset: assets/fonts/Magnite.otf

  assets:
    - assets/audio/sfx/
    - assets/fonts/
    - assets/images/