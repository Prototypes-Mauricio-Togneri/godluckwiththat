name: tensionnode
description: A resource management tower defense game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  get_it: ^7.2.0
  logger: ^1.2.2
  dafluta: ^4.9.2
  url_strategy: ^0.2.0
  json_annotation: ^4.8.0
  package_info_plus: ^3.0.3
  shared_preferences: ^2.0.18

  flame: ^1.6.0
  flame_audio: ^1.4.0
  flame_tiled: ^1.9.1
  flame_tiled_utils: ^1.0.7

  cloud_firestore: ^4.4.3
  firebase_core: ^2.7.0
  firebase_auth: ^4.2.9
  firebase_crashlytics: ^3.0.15

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  json_serializable: ^6.6.1

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Pixel.ttf

  assets:
    - assets/audio/sfx/
    - assets/images/
    - assets/images/buildings/
    - assets/images/patches/
    - assets/images/resources/
    - assets/tiles/