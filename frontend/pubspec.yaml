name: gatewayguardians
description: A city builder, resource management, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=2.19.6 <3.0.0'

dependencies:
  get_it: ^7.2.0
  logger: ^1.3.0
  dafluta: ^5.1.1
  url_strategy: ^0.2.0
  json_annotation: ^4.8.0
  shared_preferences: ^2.1.0

  flame: ^1.7.3
  flame_audio: ^2.0.2
  flame_tiled: ^1.10.1
  flame_tiled_utils: ^1.0.7

  cloud_firestore: ^4.5.2
  firebase_core: ^2.10.0
  firebase_auth: ^4.4.2
  firebase_crashlytics: ^3.1.1

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  json_serializable: ^6.6.1

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Pixel.ttf

  assets:
    - assets/audio/sfx/
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/buildings/
    - assets/images/resources/