name: tensionnode
description: A resource management tower defense game
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=2.17.6 <3.0.0'

dependencies:
  get_it: ^7.2.0
  dafluta: ^4.2.0
  motion_toast: ^2.3.2
  url_strategy: ^0.2.0
  json_annotation: ^4.6.0

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.4.2
  daassets: ^1.3.2
  daunused: ^1.3.0
  dapublock: ^1.0.1
  build_runner: ^2.2.0
  flutter_lints: ^2.0.1
  json_serializable: ^6.3.1

flutter:
  uses-material-design: true

  fonts:
    - family: BungeeHairline
      fonts:
        - asset: assets/fonts/BungeeHairlineRegular.ttf

  assets:
    - assets/fonts/
    - assets/maps/